
# Application
spring.application.name=VENDORA-AUTH-SERVICE

# Server
server.port=8082

# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

# Swagger
server.forward-headers-strategy=framework
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.vendora.auth

user.service.url=http://localhost:8081
internal.service.secret=VendoraLocalInternalSecret2026

jwt.secret=VmVuZG9yYUxvY2FsSnd0U2VjcmV0S2V5MzJCeXRlcyE=
jwt.expiration=3600000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging Configuration with Rolling File Appender
logging.file.name=logs/vendora-auth-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/vendora-auth-service-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.vendora.auth=INFO