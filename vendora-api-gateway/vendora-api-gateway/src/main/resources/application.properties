server.port=8080
spring.application.name=VENDORA-API-GATEWAY

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

# Disable automatic discovery routes; use explicit API routes
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# 1. USER SERVICE (Registration, Profiles, Representatives)
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://VENDORA-USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/registration/**,/api/users/**

# 2. AUTH SERVICE (Login, Token Validation)
spring.cloud.gateway.server.webflux.routes[1].id=auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://VENDORA-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**

# 3. MARKETPLACE SERVICE (Listings, Requests, Chat)
spring.cloud.gateway.server.webflux.routes[2].id=marketplace-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://VENDORA-MARKETPLACE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/listings/**,/api/products/**

# 4. SCRAP SERVICE (Scrap Collection, Giveaways)
spring.cloud.gateway.server.webflux.routes[3].id=scrap-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://VENDORA-SCRAP-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/scrap/**,/api/giveaways/**

# 5. PAYMENT SERVICE (Transactions, Idempotency)
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://VENDORA-PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**

# 6. HELPDESK SERVICE (Tickets, Maintenance, Facilities)
spring.cloud.gateway.server.webflux.routes[10].id=helpdesk-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://VENDORA-HELPDESK-SERVICE
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/helpdesk/**

# 7. CENTRALIZED SWAGGER AGGREGATION VIA GATEWAY
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=1. User Service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=2. Auth Service
springdoc.swagger-ui.urls[1].url=/auth-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=3. Marketplace Service
springdoc.swagger-ui.urls[2].url=/marketplace-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=4. Scrap Service
springdoc.swagger-ui.urls[3].url=/scrap-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=5. Payment Service
springdoc.swagger-ui.urls[4].url=/payment-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=6. Helpdesk Service
springdoc.swagger-ui.urls[5].url=/helpdesk-service/v3/api-docs

# Docs proxy routes
spring.cloud.gateway.server.webflux.routes[5].id=user-docs
spring.cloud.gateway.server.webflux.routes[5].uri=lb://VENDORA-USER-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/user-service/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=auth-docs
spring.cloud.gateway.server.webflux.routes[6].uri=lb://VENDORA-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/auth-service/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[7].id=marketplace-docs
spring.cloud.gateway.server.webflux.routes[7].uri=lb://VENDORA-MARKETPLACE-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/marketplace-service/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[8].id=scrap-docs
spring.cloud.gateway.server.webflux.routes[8].uri=lb://VENDORA-SCRAP-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/scrap-service/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[9].id=payment-docs
spring.cloud.gateway.server.webflux.routes[9].uri=lb://VENDORA-PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/payment-service/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[11].id=helpdesk-docs
spring.cloud.gateway.server.webflux.routes[11].uri=lb://VENDORA-HELPDESK-SERVICE
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/helpdesk-service/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[11].filters[0]=StripPrefix=1

# Global CORS Configuration for Gateway
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=false

# Shared JWT Secret
jwt.secret=VmVuZG9yYUxvY2FsSnd0U2VjcmV0S2V5MzJCeXRlcyE=

# Logging Configuration with Rolling File Appender
logging.file.name=logs/vendora-api-gateway.log
logging.logback.rollingpolicy.file-name-pattern=logs/vendora-api-gateway-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.vendora.gateway=INFO
